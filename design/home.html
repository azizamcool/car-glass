<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Glass - Reka Bentuk</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,200;0,300;0,500;0,600;0,700;0,800;1,700;1,800&family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;600;800&family=Saira:ital,wght@0,200;0,300;0,500;0,700;1,700;1,800&display=swap" rel="stylesheet">
<style>
  :root { --acc:#4fc3f7; --bg1:#0b1220; --bg2:#1b2a4a; }
  [data-theme="sport"] { --acc:#ff5252; --bg1:#120a0a; --bg2:#3a1418; }
  [data-theme="hijau"] { --acc:#69f0ae; --bg1:#07130f; --bg2:#12392c; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:"Segoe UI",Roboto,sans-serif; }
  .screen { --font:'Exo 2',sans-serif; font-family:var(--font); }
  .screen *, .screen svg text { font-family:inherit; }
  body { background:#000; color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:12px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .bar button { background:#222; color:#fff; border:1px solid #444; border-radius:20px; padding:6px 16px; cursor:pointer; font-size:14px; }
  .bar button.on { background:var(--acc); color:#000; border-color:var(--acc); }
  .wrap { width:min(100%,1280px); aspect-ratio:16/9; container-type:inline-size; }
  .screen { width:100%; height:100%; border-radius:2cqw; overflow:hidden; position:relative; padding:2.4cqw 2.6cqw 1.6cqw;
    background:radial-gradient(ellipse at 20% 10%, var(--bg2), var(--bg1) 70%); display:grid; grid-template-columns:36% 1fr; gap:2.4cqw; }
  .glow { position:absolute; width:40cqw; height:40cqw; border-radius:50%; background:var(--acc); opacity:.12; filter:blur(8cqw); left:-6cqw; top:6cqw; pointer-events:none; }
  .left { position:relative; display:flex; align-items:center; justify-content:center; }
  .gauge { width:100%; max-width:34cqw; }
  .num { font-size:9.5cqw; font-weight:200; fill:#fff; }
  .unit { font-size:2cqw; fill:rgba(255,255,255,.65); }
  .right { position:relative; display:flex; flex-direction:column; min-width:0; }
  .top { display:flex; justify-content:space-between; align-items:flex-end; }
  .clock { font-size:5.2cqw; font-weight:200; line-height:1; }
  .date { font-size:1.5cqw; color:rgba(255,255,255,.65); margin-top:.4cqw; }
  .info { text-align:right; font-size:1.4cqw; color:rgba(255,255,255,.7); line-height:1.5; }
  .info b { color:var(--acc); font-weight:600; }
  .label { font-size:1.2cqw; letter-spacing:.2em; color:rgba(255,255,255,.5); margin:2cqw 0 .8cqw; text-transform:uppercase; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1.1cqw; }
  .tile { background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16); border-radius:1.6cqw; aspect-ratio:1.25; backdrop-filter:blur(14px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.7cqw; font-size:1.4cqw; transition:.15s; }
  .tile:hover, .tile.sel { background:rgba(255,255,255,.2); border-color:var(--acc); box-shadow:0 0 2cqw -.4cqw var(--acc); transform:translateY(-2px); }
  .ico { width:4.2cqw; height:4.2cqw; border-radius:1.1cqw; display:grid; place-items:center; font-size:2.4cqw; }
  .right { padding-bottom:3.2cqw; }
  .screen[data-mode="siang"] .bg::after { background:linear-gradient(90deg, rgba(0,10,30,.35), rgba(0,10,30,.05) 45%, rgba(0,10,30,.3)); }
  .screen[data-mode="siang"] .tile:not(.all), .screen[data-mode="siang"] .pt { background:rgba(8,20,45,.42); border-color:rgba(255,255,255,.28); }
  .screen[data-mode="siang"] .clock, .screen[data-mode="siang"] .date, .screen[data-mode="siang"] .info, .screen[data-mode="siang"] .next-line, .screen[data-mode="siang"] .label { text-shadow:0 1px 6px rgba(0,0,0,.55); }
  .screen[data-mode="siang"] #track { stroke:rgba(255,255,255,.35); }
  .grid.big { flex:1; min-height:0; grid-template-columns:repeat(2,1fr); grid-auto-rows:1fr; gap:1.6cqw; }
  .grid.big .tile { aspect-ratio:auto; flex-direction:row; justify-content:flex-start; padding:0 2.4cqw; font-size:2.3cqw; gap:2cqw; border-radius:2.4cqw; font-weight:500; }
  .grid.big .ico { width:7.4cqw; height:7.4cqw; border-radius:1.9cqw; font-size:4cqw; flex:none; }
  .grid.big .tile.all .ico { background:rgba(0,0,0,.15); }
  .gauge { max-width:none; }
  .left { padding-bottom:2cqw; }
  .clock { font-size:6.3cqw!important; font-weight:200; letter-spacing:-.02em; }
  .date { font-size:1.9cqw!important; }
  .hint { font-size:1.25cqw; color:var(--acc); margin-top:.5cqw; min-height:1.6cqw; }
  .screen.rain .bg::after { background:linear-gradient(180deg, rgba(10,20,40,.55), rgba(10,20,40,.4)); }
  .screen.rain .layer { filter:saturate(.55) brightness(.75); }
  .left { flex-direction:column!important; }
  .wxbox { text-align:center; margin-bottom:.4cqw; }
  .wxbox .loc { font-size:1.6cqw; color:rgba(255,255,255,.8); }
  .wxbox .wxv { display:flex; gap:1cqw; align-items:center; justify-content:center; font-size:1.7cqw; margin-top:.3cqw; color:rgba(255,255,255,.9); }
  .wxbox .wxv b { font-size:2.6cqw; font-weight:300; color:#fff; }
  .wxbox .wi { font-size:2.6cqw; }
  .gauge { max-width:30cqw!important; }
  .screen[data-mode="siang"] .wxbox { text-shadow:0 1px 6px rgba(0,0,0,.6); }
  .chips { display:flex; gap:.8cqw; justify-content:flex-end; margin-bottom:.8cqw; }
  .chip { display:inline-flex; align-items:center; gap:.6cqw; padding:.5cqw 1.1cqw .5cqw .8cqw; border-radius:2cqw; font-size:1.25cqw; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); }
  .chip svg { width:1.7cqw; height:1.7cqw; flex:none; }
  .chip.ok { color:#69f0ae; } .chip.ok .slash { display:none; }
  .chip.off { color:#ff8a80; border-color:rgba(255,138,128,.5); } .chip.off .slash { display:block; }
  .chip span { color:#fff; }
  .layer { position:absolute; inset:0; transition:opacity 1.2s ease; }
  .layer svg { width:100%; height:100%; display:block; }
  .screen .tile, .screen .pt { transition:background .8s; }
  .bg { position:absolute; inset:0; z-index:0; }
  .bg svg { width:100%; height:100%; display:block; }
  .bg::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,.1) 45%, rgba(0,0,0,.35)); }
  .left, .right { z-index:1; } .dock, .drawer { z-index:2; } .drawer { z-index:5; }
  .glow { z-index:0; }
  .blob { animation:drift 14s ease-in-out infinite alternate; }
  .blob:nth-child(2) { animation-duration:19s; animation-delay:-5s; }
  .blob:nth-child(3) { animation-duration:23s; animation-delay:-9s; }
  @keyframes drift { to { transform:translate(120px,-60px) scale(1.2); } }
  .streak { animation:fly 3.2s linear infinite; }
  @keyframes fly { from { opacity:0; transform:translateY(0) scaleY(.3); } 30% { opacity:1; } to { opacity:0; transform:translateY(160px) scaleY(1.4); } }
  .prayer { display:grid; grid-template-columns:repeat(6,1fr); gap:.8cqw; margin-top:1.6cqw; }
  .pt { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); border-radius:1.1cqw; padding:.7cqw 0; text-align:center; font-size:1.15cqw; color:rgba(255,255,255,.6); }
  .pt b { display:block; font-size:1.7cqw; font-weight:400; color:#fff; margin-top:.15cqw; }
  .pt.next { border-color:var(--acc); background:rgba(255,255,255,.16); color:var(--acc); }
  .pt.next b { color:var(--acc); }
  .next-line { font-size:1.2cqw; color:rgba(255,255,255,.6); margin-top:.6cqw; }
  .next-line b { color:var(--acc); font-weight:600; }
  .tile.all { background:var(--acc); color:#000; border-color:var(--acc); font-weight:600; cursor:pointer; }
  .tile.all .ico { background:rgba(0,0,0,.15)!important; }
  .drawer { position:absolute; inset:0; background:rgba(6,10,20,.92); backdrop-filter:blur(18px); padding:2.4cqw 2.6cqw; display:none; flex-direction:column; z-index:5; }
  .drawer.open { display:flex; }
  .drawer .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.6cqw; font-size:2.2cqw; }
  .drawer .close { font-size:1.5cqw; padding:.6cqw 1.6cqw; border:1px solid rgba(255,255,255,.3); border-radius:2cqw; cursor:pointer; }
  .drawer .grid { grid-template-columns:repeat(8,1fr); }
  .dock { position:absolute; left:2.6cqw; right:2.6cqw; bottom:1.4cqw; display:flex; justify-content:space-between; font-size:1.2cqw; color:rgba(255,255,255,.55); }
  .dock span::before { content:"\25CF "; color:var(--acc); }
  .tile { position:relative; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .tile.holding { animation:hold .7s linear forwards; }
  @keyframes hold { 0% { transform:scale(1); box-shadow:0 0 0 0 var(--acc); } 100% { transform:scale(.95); box-shadow:0 0 0 .55cqw var(--acc); } }
  .edit { position:absolute; top:.9cqw; right:1.1cqw; font-size:1.25cqw; padding:.35cqw .9cqw; border-radius:1.2cqw; background:rgba(255,255,255,.14); color:rgba(255,255,255,.8); cursor:pointer; }
  /* ---- Mod siang: panel kaca cerah, teks gelap ---- */
  .screen[data-mode="siang"] { --acc:#0277bd; color:#0d1b2e; }
  .screen[data-mode="siang"] .bg::after { background:linear-gradient(90deg, rgba(255,255,255,.18), rgba(255,255,255,0) 45%, rgba(255,255,255,.12)); }
  .screen[data-mode="siang"] .clock, .screen[data-mode="siang"] .date, .screen[data-mode="siang"] .info, .screen[data-mode="siang"] .info b,
  .screen[data-mode="siang"] .next-line, .screen[data-mode="siang"] .label, .screen[data-mode="siang"] .wxbox, .screen[data-mode="siang"] .wxbox .loc,
  .screen[data-mode="siang"] .wxbox .wxv, .screen[data-mode="siang"] .wxbox .wxv b { color:#0d1b2e; text-shadow:none; }
  .screen[data-mode="siang"] .label, .screen[data-mode="siang"] .date, .screen[data-mode="siang"] .next-line { color:rgba(13,27,46,.72); }
  .screen[data-mode="siang"] .info b, .screen[data-mode="siang"] .next-line b { color:#01579b; }
  .screen[data-mode="siang"] .num { fill:#0d1b2e; }
  .screen[data-mode="siang"] .unit, .screen[data-mode="siang"] #limit { fill:rgba(13,27,46,.65); }
  .screen[data-mode="siang"] #nums { fill:rgba(13,27,46,.7); }
  .screen[data-mode="siang"] #ticks { stroke:rgba(13,27,46,.55); }
  .screen[data-mode="siang"] #track { stroke:rgba(13,27,46,.2); }
  .screen[data-mode="siang"] .tile:not(.all), .screen[data-mode="siang"] .pt { background:rgba(255,255,255,.58); border-color:rgba(255,255,255,.9); color:#0d1b2e; box-shadow:0 4px 18px -8px rgba(0,30,60,.35); }
  .screen[data-mode="siang"] .pt b { color:#0d1b2e; }
  .screen[data-mode="siang"] .pt.next { background:rgba(255,255,255,.85); border-color:#0277bd; color:#0277bd; }
  .screen[data-mode="siang"] .pt.next b { color:#0277bd; }
  .screen[data-mode="siang"] .tile.all { background:#0277bd; border-color:#0277bd; color:#fff; }
  .screen[data-mode="siang"] .tile.all .ico { color:#fff; }
  .screen[data-mode="siang"] .edit { background:rgba(13,27,46,.1); color:rgba(13,27,46,.75); }
  .screen[data-mode="siang"] .chip { background:rgba(255,255,255,.7); border-color:rgba(255,255,255,.95); }
  .screen[data-mode="siang"] .chip span { color:#0d1b2e; }
  .screen[data-mode="siang"] .chip.ok { color:#1b8a4b; } .screen[data-mode="siang"] .chip.off { color:#c62828; border-color:rgba(198,40,40,.5); }
  .screen[data-mode="siang"] .hint { color:#01579b; font-weight:600; }
  .screen { --seg-off:rgba(255,255,255,.14); --seg-red:rgba(255,82,82,.3); }
  .screen[data-mode="siang"] { --seg-off:rgba(13,27,46,.16); --seg-red:rgba(220,50,50,.3); }
  .screen[data-mode="siang"] .gauge { background:rgba(255,255,255,.55); border-radius:50%; box-shadow:0 10px 34px -12px rgba(0,40,80,.45); backdrop-filter:blur(10px); }
  .screen[data-mode="siang"] #segs, .screen[data-mode="siang"] #needle { filter:none!important; }
  .screen[data-mode="siang"] #needle { fill:#0d1b2e; }
  .screen[data-mode="siang"] .tile:not(.all), .screen[data-mode="siang"] .pt { background:rgba(255,255,255,.74); }
  .screen[data-mode="siang"] .pt.next { background:rgba(255,255,255,.92); }
  .num { paint-order:stroke; }
  /* ---- 6 app: grid 3x2, ikon di atas ---- */
  .grid.big { grid-template-columns:repeat(3,1fr); gap:1.3cqw; }
  .grid.big .tile { flex-direction:column; justify-content:center; padding:0 1cqw; gap:1cqw; font-size:1.9cqw; font-weight:600; text-align:center; border-radius:2.2cqw; }
  .grid.big .tile { gap:.6cqw!important; padding-top:.4cqw!important; }
  .grid.big .ico { width:6.8cqw; height:6.8cqw; border-radius:1.8cqw; font-size:4cqw; overflow:hidden; display:grid; place-items:center; box-shadow:0 .5cqw 1.4cqw -.4cqw rgba(0,0,0,.45); }
  .labelrow { display:flex; justify-content:space-between; align-items:flex-end; }
  .labelrow .label { margin-bottom:.8cqw; }
  .allpill { margin-bottom:.8cqw; padding:.65cqw 1.8cqw; border-radius:3cqw; background:var(--acc); color:#04121c; font-size:1.55cqw; font-weight:700; cursor:pointer; white-space:nowrap; }
  .screen[data-mode="siang"] .allpill { background:#0277bd; color:#fff; }
  /* ---- Splash NEXUP (animasi sapuan, ikut logo.css laman web) ---- */
  .splash { position:absolute; inset:0; z-index:30; display:grid; place-items:center; opacity:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, #12203a, #05070f 70%); }
  .splash.hold { opacity:1; }
  .splash.play { animation:spFade 1.3s ease both; }
  @keyframes spFade { 0% { opacity:0; } 10% { opacity:1; } 82% { opacity:1; } 100% { opacity:0; } }
  .nexlogo { --ac:#e63329; --tx:#fff; position:relative; display:inline-flex; align-items:center; font-size:9.5cqw; font-weight:800; letter-spacing:-.015em; }
  .nexlogo .body { display:flex; align-items:center; gap:.36em; }
  .nexlogo .wm { color:var(--tx); } .nexlogo .up { color:var(--ac); }
  .nexlogo .swp { position:absolute; right:-.72em; top:48%; font-size:.52em; line-height:1; color:var(--ac); transform:translateY(-50%); }
  .splash.play .body { animation:nexBody .85s cubic-bezier(.35,.1,.25,1) both; }
  .splash.play .swp { animation:nexSwp .85s cubic-bezier(.35,.1,.25,1) both; }
  @keyframes nexSwp { 0% { transform:translateY(-50%) translateX(calc(-1 * var(--nex-sw,150px))) scale(3.6); } 55% { transform:translateY(-50%) translateX(0) scale(3.6); } 75%,100% { transform:translateY(-50%) translateX(0) scale(1); } }
  @keyframes nexBody { 0% { clip-path:inset(0 100% 0 0); } 10% { clip-path:inset(0 97% 0 0); } 58% { clip-path:inset(0 4% 0 0); } 75%,100% { clip-path:inset(0 0 0 0); } }
  .chip { white-space:nowrap; }
  #wifi > span { max-width:11cqw; overflow:hidden; text-overflow:ellipsis; }
  .clock { font-weight:700!important; letter-spacing:-.01em; white-space:nowrap; }
  .clock .ampm { font-size:.3em; font-weight:700; letter-spacing:.06em; margin-left:.28em; color:var(--acc); }
  .screen[data-mode="siang"] .clock .ampm { color:#0277bd; }
  /* ===== v4: kaca sebenar (lutsinar + kabur + kilatan tepi) ===== */
  .tile:not(.all), .pt, .chip {
    background:linear-gradient(135deg, rgba(255,255,255,.17), rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(20px) saturate(1.5); backdrop-filter:blur(20px) saturate(1.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(255,255,255,.05), 0 12px 30px -16px rgba(0,0,0,.65);
  }
  .screen[data-mode="siang"] .tile:not(.all), .screen[data-mode="siang"] .pt, .screen[data-mode="siang"] .chip {
    background:linear-gradient(135deg, rgba(255,255,255,.40), rgba(255,255,255,.12));
    border:1px solid rgba(255,255,255,.75);
    -webkit-backdrop-filter:blur(22px) saturate(1.8); backdrop-filter:blur(22px) saturate(1.8);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.3), 0 16px 36px -18px rgba(8,40,100,.5);
  }
  .screen[data-mode="siang"] .pt.next { background:linear-gradient(135deg, rgba(255,255,255,.72), rgba(255,255,255,.28)); border-color:#2b90d9; }
  .screen[data-mode="siang"] .gauge {
    background:radial-gradient(circle at 30% 22%, rgba(255,255,255,.55), rgba(255,255,255,.14) 72%);
    border:1px solid rgba(255,255,255,.75); -webkit-backdrop-filter:blur(18px) saturate(1.6); backdrop-filter:blur(18px) saturate(1.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 18px 40px -20px rgba(8,40,100,.5);
  }
  /* ikon: plat kaca kecil, simbol di tengah (tiada petak putih/kelabu) */
  .ico { color:#fff; }
  .screen[data-mode="siang"] .ico { color:#0d1b2e; }
  .grid.big .ico, .drawer .ico {
    background:linear-gradient(150deg, rgba(255,255,255,.30), rgba(255,255,255,.06))!important;
    border:1px solid rgba(255,255,255,.35); box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 8px 16px -8px rgba(0,0,0,.55);
    overflow:visible!important;
  }
  .screen[data-mode="siang"] .grid.big .ico, .screen[data-mode="siang"] .drawer .ico {
    background:linear-gradient(150deg, rgba(255,255,255,.80), rgba(255,255,255,.28))!important;
    border:1px solid rgba(255,255,255,.9); box-shadow:inset 0 1px 0 #fff, 0 10px 18px -10px rgba(8,40,100,.55);
  }
  .grid.big .ico > svg { width:68%; height:68%; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .grid.big .ico > div { transform:scale(.9); }
  /* ===== v5: simbol besar terapung di atas kaca, tanpa plat kedua ===== */
  .grid.big .ico, .screen[data-mode="siang"] .grid.big .ico {
    background:none!important; border:none!important; box-shadow:none!important;
    width:7.8cqw!important; height:7.8cqw!important;
  }
  .grid.big .ico > svg { width:100%!important; height:100%!important; filter:drop-shadow(0 .35cqw .5cqw rgba(0,0,0,.4)); }
  .screen[data-mode="siang"] .grid.big .ico > svg { filter:drop-shadow(0 .35cqw .5cqw rgba(8,40,100,.35)); }
  .grid.big .tile { gap:.4cqw!important; }
  .ico i { font-size:7.2cqw; line-height:1; display:block; filter:drop-shadow(0 .35cqw .6cqw rgba(0,0,0,.35)); }
  /* ===== v6: lebih lutsinar, tema siang ikut tema, teks dan ikon sedikit lebih besar ===== */
  .tile:not(.all), .pt, .chip {
    background:linear-gradient(135deg, rgba(255,255,255,.11), rgba(255,255,255,.025));
    border:1px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter:blur(26px) saturate(1.6); backdrop-filter:blur(26px) saturate(1.6);
  }
  .screen[data-mode="siang"] .tile:not(.all), .screen[data-mode="siang"] .pt, .screen[data-mode="siang"] .chip {
    background:linear-gradient(135deg, rgba(255,255,255,.26), rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.62);
    -webkit-backdrop-filter:blur(28px) saturate(1.9); backdrop-filter:blur(28px) saturate(1.9);
  }
  .screen[data-mode="siang"] .pt.next { background:linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.18)); }
  .screen[data-mode="siang"] .gauge { background:radial-gradient(circle at 30% 22%, rgba(255,255,255,.40), rgba(255,255,255,.08) 72%); }
  /* tema juga mengubah siang */
  body[data-theme="sport"] #ld { filter:hue-rotate(165deg) saturate(1.15); }
  body[data-theme="hijau"] #ld { filter:hue-rotate(-62deg) saturate(1.05); }

  return `<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="ps" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1040"/><stop offset=".35" stop-color="#8e2f6b"/><stop offset=".55" stop-color="#ff7e5f"/><stop offset="1" stop-color="#feb47b"/></linearGradient><linearGradient id="pw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1b55"/><stop offset="1" stop-color="#120a26"/></linearGradient></defs>
  <rect width="1280" height="720" fill="url(#ps)"/><circle cx="640" cy="400" r="95" fill="#ffe0a8"/><circle cx="640" cy="400" r="200" fill="#ffb37a" opacity=".25"/>
  <rect y="400" width="1280" height="320" fill="url(#pw)"/>${l}<path d="M0 470 Q200 440 420 470 T900 470 T1280 455 V720 H0Z" fill="#0b0618" opacity=".0"/></svg>`;};
bgs.gunung=()=>{const layer=(base,amp,col,op)=>{let p=`M0 ${base}`;for(let x=0;x<=1280;x+=40)p+=` L${x} ${base-amp*(.4+.6*Math.abs(Math.sin(x*.011+base))+rnd()*.25)}`;return `<path d="${p} L1280 720 L0 720Z" fill="${col}" opacity="${op}"/>`;};
  let st='';for(let i=0;i<70;i++)st+=`<circle cx="${rnd()*1280}" cy="${rnd()*260}" r="${rnd()*1.4+.3}" fill="#fff" opacity="${.3+rnd()*.6}"/>`;
  return `<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050816"/><stop offset=".7" stop-color="#1c2b55"/><stop offset="1" stop-color="#4a5f9a"/></linearGradient><filter id="mist"><feGaussianBlur stdDeviation="14"/></filter></defs>
  <rect width="1280" height="720" fill="url(#gs)"/>${st}<circle cx="1000" cy="130" r="38" fill="#f5f1d8"/><circle cx="1000" cy="130" r="90" fill="#f5f1d8" opacity=".12"/>
  ${layer(430,170,'#31407a',.9)}<rect y="440" width="1280" height="60" fill="#8fa3d8" opacity=".25" filter="url(#mist)"/>${layer(520,150,'#1d2a58',.95)}<rect y="520" width="1280" height="60" fill="#8fa3d8" opacity=".2" filter="url(#mist)"/>${layer(620,120,'#0e1634',1)}</svg>`;};
bgs.neon=()=>{let g='';for(let i=-14;i<=14;i++)g+=`<line x1="${640+i*28}" y1="430" x2="${640+i*190}" y2="720" stroke="var(--acc)" stroke-width="1.5" opacity=".55"/>`;
  for(let i=0;i<9;i++){const y=430+Math.pow(i/8,2.2)*290;g+=`<line x1="0" y1="${y}" x2="1280" y2="${y}" stroke="var(--acc)" stroke-width="1.5" opacity=".5"/>`;}
  return `<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="ns" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05030f"/><stop offset="1" stop-color="var(--bg2)"/></linearGradient><linearGradient id="nsun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd54f"/><stop offset="1" stop-color="var(--acc)"/></linearGradient><clipPath id="hc"><rect x="0" y="0" width="1280" height="430"/></clipPath></defs>
  <rect width="1280" height="720" fill="url(#ns)"/><g clip-path="url(#hc)"><circle cx="640" cy="400" r="170" fill="url(#nsun)" opacity=".9"/></g>${g}</svg>`;};
bgs.hutan=()=>{const tree=(x,b,h,col,op)=>{const w=h*.28;return `<polygon points="${x},${b-h} ${x-w},${b} ${x+w},${b}" fill="${col}" opacity="${op}"/><polygon points="${x},${b-h*1.25} ${x-w*.75},${b-h*.35} ${x+w*.75},${b-h*.35}" fill="${col}" opacity="${op}"/>`;};
  let t='';for(let l=0;l<3;l++){const cols=['#2e5a4c','#1f4236','#10281f'];for(let i=0;i<22;i++)t+=tree(rnd()*1300,480+l*90,120+l*70+rnd()*60,cols[l],.95);t+=`<rect y="${400+l*90}" width="1280" height="90" fill="#cfe8dc" opacity=".12" filter="url(#fg)"/>`;}
  return `<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="hs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c2a2a"/><stop offset=".6" stop-color="#2d6a5f"/><stop offset="1" stop-color="#9ac9b8"/></linearGradient><filter id="fg"><feGaussianBlur stdDeviation="16"/></filter></defs><rect width="1280" height="720" fill="url(#hs)"/><circle cx="260" cy="170" r="140" fill="#e8f5d0" opacity=".14"/>${t}<rect y="640" width="1280" height="80" fill="#08140f"/></svg>`;};
bgs.bokeh=()=>{let b='';const cols=['var(--acc)','#ffd54f','#ff4081','#fff','#7c4dff'];for(let i=0;i<46;i++){const r=14+rnd()*52;b+=`<circle cx="${rnd()*1280}" cy="${150+rnd()*480}" r="${r}" fill="${cols[Math.floor(rnd()*5)]}" opacity="${.12+rnd()*.3}"/>`;}
  return `<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="bk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05060f"/><stop offset="1" stop-color="var(--bg2)"/></linearGradient><filter id="bb"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="1280" height="720" fill="url(#bk)"/><g filter="url(#bb)">${b}</g></svg>`;};
bgs.siang=()=>{let c='',m='';
  for(const [x,y,w] of [[130,60,90],[360,38,60],[1090,48,95],[800,34,45]])c+=`<g opacity=".55"><ellipse cx="${x}" cy="${y}" rx="${w}" ry="${w*.24}" fill="#fff"/><ellipse cx="${x-w*.4}" cy="${y+w*.06}" rx="${w*.55}" ry="${w*.18}" fill="#fff"/><ellipse cx="${x+w*.45}" cy="${y+w*.07}" rx="${w*.5}" ry="${w*.17}" fill="#fff"/></g>`;
  for(let i=0;i<12;i++){const x=i*115-50,mh=40+rnd()*60;m+=`<polygon points="${x},420 ${x+70},${420-mh} ${x+150},420" fill="#8fb9da" opacity=".6"/>`;}
  let dash='';for(let i=0;i<8;i++){const y=440+i*i*4.6,w=3+i*1.3,hh=8+i*4;dash+=`<rect x="${640-w/2}" y="${y}" width="${w}" height="${hh}" fill="#fff" opacity=".75"/>`;}
  return `<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="dsk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f93e0"/><stop offset=".6" stop-color="#9fd2f5"/><stop offset="1" stop-color="#e6f5ff"/></linearGradient><linearGradient id="dgr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc3a1"/><stop offset="1" stop-color="#5f9a78"/></linearGradient></defs>
  <rect width="1280" height="720" fill="url(#dsk)"/>${c}${m}<rect y="420" width="1280" height="300" fill="url(#dgr)"/>
  <polygon points="612,420 668,420 1180,720 100,720" fill="#6d7888"/><polygon points="612,420 622,420 330,720 100,720" fill="#fff" opacity=".3"/><polygon points="658,420 668,420 1180,720 950,720" fill="#fff" opacity=".3"/>${dash}</svg>`;};
let mode='auto',nightBg='jalan',simT=new Date().getHours()+new Date().getMinutes()/60;
const RISE=6.95,SET=18.97,FADE=.7; // Syuruk & Maghrib (jam), pudar ~42 min
const clamp=x=>Math.max(0,Math.min(1,x)),sm=x=>x*x*(3-2*x);
function dayFactor(t){return Math.min(sm(clamp((t-(RISE-FADE/2))/FADE)),1-sm(clamp((t-(SET-FADE/2))/FADE)));}
const hhmm=t=>String(Math.floor(t)).padStart(2,'0')+':'+String(Math.round((t%1)*60)).padStart(2,'0').replace('60','59');
var hour12=true;
function setClock(){const t=mode==='auto'?simT:new Date().getHours()+new Date().getMinutes()/60;
  const h=Math.floor(t),m=Math.floor((t%1)*60),mm=String(m).padStart(2,'0');
  document.getElementById('ct').textContent=hour12?`${h%12||12}:${mm}`:`${String(h).padStart(2,'0')}:${mm}`;
  document.getElementById('ap').textContent=hour12?(h<12?'AM':'PM'):'';}
function render(){
  const f=mode==='siang'?1:mode==='malam'?0:dayFactor(simT);
  const bg=document.getElementById('bg');
  if(!bg.dataset.night||bg.dataset.night!==nightBg){bg.innerHTML=`<div class="layer" id="ln">${bgs[nightBg]()}</div><div class="layer" id="ld">${bgs.siang()}</div>`;bg.dataset.night=nightBg;}
  document.getElementById('ld').style.opacity=f;
  document.getElementById('screen').dataset.mode=(f>=.5&&!rainOn)?'siang':'malam';
  document.getElementById('tval').textContent=hhmm(simT)+(mode==='auto'?'  ('+(f>=.99?'siang':f<=.01?'malam':'senja/fajar')+')':'');
  setClock();
  document.querySelectorAll('[data-bg]').forEach(b=>b.classList.toggle('on',b.dataset.bg===nightBg));
  document.querySelectorAll('button[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));}
function setBg(k){nightBg=k;render();}
document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render();});
document.getElementById('tslider').value=simT;
document.getElementById('tslider').oninput=e=>{simT=+e.target.value;mode='auto';render();};
let wifiOn=true;
function wifi(){const w=document.getElementById('wifi');w.className='chip '+(wifiOn?'ok':'off');w.querySelector('span').textContent=wifiOn?'Rangkaian-Rumah':'Tiada Wi-Fi';document.getElementById('wtog').textContent=wifiOn?'Simulasi Wi-Fi putus':'Simulasi Wi-Fi sambung';
  const v=document.getElementById('wxv'),ic=rainOn?'&#127783;':'&#9925;',tmp=rainOn?26:31,cond=rainOn?'Hujan':'Cerah berawan';
  v.innerHTML=wifiOn?`<span class="wi">${ic}</span><b>${tmp}&deg;C</b><span>${cond}</span>`:`<span class="wi" style="opacity:.5">${ic}</span><b style="opacity:.6">${tmp}&deg;C</b><span style="opacity:.6">Kemas kini 2 j lalu</span>`;
  document.querySelector('#wx .loc').innerHTML='&#128205; Kuala Lumpur'+(wifiOn?'':' <span style="opacity:.55">(disimpan)</span>');
  document.getElementById('whint').textContent=wifiOn?'':'Sambung Wi-Fi atau hotspot untuk cuaca';
  document.getElementById('rtog').textContent=rainOn?'Cuaca: Hujan (tekan untuk cerah)':'Cuaca: Cerah (tekan untuk hujan)';
  document.getElementById('screen').classList.toggle('rain',rainOn);}
let rainOn=false;
const cv=document.getElementById('rain'),rc=cv.getContext('2d');let drops=[],glassD=[];
function sizeRain(){const r=cv.parentElement.getBoundingClientRect();cv.width=r.width;cv.height=r.height;initRain();}
function initRain(){const k=cv.width/1280;drops=[];for(let i=0;i<110;i++)drops.push({x:Math.random()*cv.width,y:Math.random()*cv.height,l:(12+Math.random()*22)*k,v:(16+Math.random()*10)*k,a:.18+Math.random()*.3});
  glassD=[];for(let i=0;i<18;i++)glassD.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:(2+Math.random()*4.5)*k,s:0,w:Math.random()*200});}
function rainLoop(){if(!rainOn){rc.clearRect(0,0,cv.width,cv.height);return;}
  rc.clearRect(0,0,cv.width,cv.height);const k=cv.width/1280;rc.lineWidth=1.3*k;rc.lineCap='round';
  for(const d of drops){rc.strokeStyle=`rgba(200,225,255,${d.a})`;rc.beginPath();rc.moveTo(d.x,d.y);rc.lineTo(d.x-d.l*.25,d.y+d.l);rc.stroke();d.y+=d.v;d.x-=d.v*.22;if(d.y>cv.height||d.x<0){d.y=-d.l;d.x=Math.random()*cv.width*1.2;}}
  for(const g of glassD){const gr=rc.createRadialGradient(g.x-g.r*.3,g.y-g.r*.3,g.r*.1,g.x,g.y,g.r);gr.addColorStop(0,'rgba(255,255,255,.75)');gr.addColorStop(1,'rgba(160,200,255,.12)');rc.fillStyle=gr;rc.beginPath();rc.ellipse(g.x,g.y,g.r,g.r*1.25,0,0,7);rc.fill();
    if(g.w>0)g.w--;else{g.s=g.s||Math.random()*.9+.2;g.y+=g.s;g.x+=Math.sin(g.y*.05)*.2;if(Math.random()<.01){g.s=0;g.w=60+Math.random()*180;}if(g.y>cv.height+10){g.y=-10;g.x=Math.random()*cv.width;g.s=0;g.w=Math.random()*120;}}}
  requestAnimationFrame(rainLoop);}
window.addEventListener('resize',sizeRain);sizeRain();
document.getElementById('rtog').onclick=()=>{rainOn=!rainOn;wifi();render();if(rainOn)rainLoop();else rc.clearRect(0,0,cv.width,cv.height);};
document.getElementById('wtog').onclick=()=>{wifiOn=!wifiOn;wifi();};wifi();
render();
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>setBg(b.dataset.bg));
document.querySelectorAll('button[data-font]').forEach(b=>b.onclick=()=>{document.getElementById('screen').style.setProperty('--font',b.dataset.font);document.querySelectorAll('button[data-font]').forEach(x=>x.classList.toggle('on',x===b));});
document.getElementById('h12tog').onclick=e=>{hour12=!hour12;e.target.textContent=hour12?'Jam: 12j (AM/PM)':'Jam: 24j';render();};
function playSplash(){const s=document.getElementById('splash'),l=document.getElementById('nexlogo');s.classList.remove('play','hold');l.style.setProperty('--nex-sw',l.offsetWidth+'px');void s.offsetWidth;s.classList.add('play');}
document.getElementById('splashbtn').onclick=playSplash;
if(location.hash.includes('splashhold'))document.getElementById('splash').classList.add('hold');
{const h=location.hash;const fm={rajdhani:1,orbitron:2,saira:3};for(const k in fm)if(h.includes(k))document.querySelectorAll('button[data-font]')[fm[k]].click();if(h.includes('siang')){mode='siang';}if(h.includes('malam')){mode='malam';}if(h.includes('hujan')){rainOn=true;wifi();}if(h.includes('drive')){document.getElementById('drive').click();}render();}
document.getElementById('themes').addEventListener('click',e=>{const t=e.target.dataset.t;if(!t)return;
  document.body.dataset.theme=t;document.querySelectorAll('#themes [data-t]').forEach(b=>b.classList.toggle('on',b===e.target));});
/* pautan pintas untuk tangkap skrin: #bare (tanpa bar kawalan), #bg-bandar, #tema-sport, #drawer */
{const h=location.hash;
 if(h.includes('bare'))document.body.classList.add('bare');
 const mb=h.match(/bg-(\w+)/); if(mb&&bgs[mb[1]]){nightBg=mb[1];render();}
 const mt=h.match(/tema-(\w+)/); if(mt){const b=document.querySelector(`button[data-t="${mt[1]}"]`); if(b)b.click();}
 if(h.includes('drawer'))document.getElementById('allbtn').click();}
</script>
</body>
